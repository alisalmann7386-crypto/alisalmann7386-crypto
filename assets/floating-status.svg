<svg xmlns="http://www.w3.org/2000/svg" width="900" height="62" viewBox="0 0 900 62" role="img" aria-labelledby="title desc"><title id="title">What Salman is building</title><desc id="desc">Animated terminal taglines cycling through AI agents, retrieval augmented generation and software engineering.</desc><rect x="1" y="1" width="898" height="60" rx="14" fill="#151B18" stroke="#405344"/><circle cx="26" cy="31" r="5" fill="#C5F277"/><text x="42" y="37" font-family="monospace" font-size="18" font-weight="600" fill="#C5F277">~/salman</text><text x="160" y="37" font-family="monospace" font-size="18" fill="#E9F0E5" opacity="0">$ building intelligent AI agents<animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;.26;.30;.31;.65;.66;.97;1" dur="12s" repeatCount="indefinite"/></text><text x="160" y="37" font-family="monospace" font-size="18" fill="#E9F0E5" opacity="0">$ making videos searchable with RAG<animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;.28;.33;.60;.65;.66;.97;1" dur="12s" repeatCount="indefinite"/></text><text x="160" y="37" font-family="monospace" font-size="18" fill="#E9F0E5" opacity="0">$ turning research into software<animate attributeName="opacity" values="0;0;0;0;1;1;1;0" keyTimes="0;.28;.33;.60;.66;.94;.97;1" dur="12s" repeatCount="indefinite"/></text><rect x="826" y="18" width="10" height="27" fill="#C5F277"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect></svg>