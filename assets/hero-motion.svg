<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Md Salman Ali — Software Engineering and Applied AI</title>
<desc id="desc">Editorial charcoal and lime portfolio hero with softly floating AI-orbit graphics, small glowing particles, and a static readable name.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101612"/><stop offset="1" stop-color="#1C2520"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C5F277"/><stop offset="1" stop-color="#AAA7FF"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#C5F277" stop-opacity=".13"/><stop offset="1" stop-color="#C5F277" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#E9F3DF" opacity=".10"/></pattern>
 <clipPath id="frame"><rect width="1200" height="430" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
 <rect width="1200" height="430" fill="url(#bg)"/>
 <rect width="1200" height="430" fill="url(#dots)"/>
 <circle cx="938" cy="217" r="270" fill="url(#halo)"><animate attributeName="opacity" values=".55;1;.55" dur="8s" repeatCount="indefinite"/></circle>
 <path d="M50 68H547 M0 359H1200" stroke="#A8C0A9" opacity=".22"/>
 <g font-family="Arial,Helvetica,sans-serif">
  <text x="52" y="52" font-size="14" font-weight="700" letter-spacing="3" fill="#C5F277">MD / PORTFOLIO</text>
  <text x="52" y="158" font-size="90" font-weight="800" letter-spacing="-5" fill="#F5F5ED">SALMAN</text>
  <text x="52" y="252" font-size="90" font-weight="800" letter-spacing="-5" fill="#F5F5ED">ALI<tspan fill="#C5F277">.</tspan></text>
  <text x="56" y="309" font-size="21" letter-spacing=".8" fill="#D9E4D4">SOFTWARE ENGINEERING <tspan fill="#C5F277">×</tspan> APPLIED AI</text>
  <text x="54" y="396" font-size="13" letter-spacing="2.2" fill="#B1C1B2">THINK / DESIGN / BUILD / ITERATE</text>
 </g>
 <g transform="translate(929 215)">
  <g>
   <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0;0 7;0 0" keyTimes="0;.27;.55;.79;1" dur="8s" repeatCount="indefinite"/>
   <circle r="151" fill="none" stroke="#99B39A" stroke-opacity=".32"/>
   <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
    <circle r="115" fill="none" stroke="#C5F277" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="4 10"/>
    <circle cx="115" cy="0" r="6" fill="#C5F277"/><circle cx="-115" cy="0" r="4" fill="#AAA7FF"/>
   </g>
   <g>
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="52s" repeatCount="indefinite"/>
    <circle r="78" fill="none" stroke="#AAA7FF" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="0" cy="-78" r="5" fill="#AAA7FF"/><circle cx="0" cy="78" r="5" fill="#C5F277"/>
   </g>
   <path d="M-150 0H150 M0 -150V150" fill="none" stroke="#8EAA92" stroke-opacity=".18"/>
   <path d="M-78 -12L-35 -35L63 -20L77 34L15 75L-78 -12M-35 -35L0 -78M63 -20L112 -23M15 75L0 114" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2" fill="none"/>
   <circle cx="-78" cy="-12" r="5" fill="#AAA7FF"/><circle cx="63" cy="-20" r="5" fill="#C5F277"/><circle cx="15" cy="75" r="5" fill="#AAA7FF"/>
   <rect x="-42" y="-42" width="84" height="84" rx="22" fill="#29372D" stroke="#C5F277" stroke-width="1.8"/>
   <path d="M-14 -14L-27 0L-14 14 M14 -14L27 0L14 14 M8 -19L-8 19" stroke="#C5F277" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
 </g>
 <g font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
  <g transform="translate(719 104)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6.5s" repeatCount="indefinite"/><rect width="111" height="35" rx="17.5" fill="#29382F" stroke="#C5F277" stroke-opacity=".7"/><circle cx="17" cy="17" r="4" fill="#C5F277"/><text x="30" y="22" fill="#E4F6D5">AI AGENTS</text></g></g>
  <g transform="translate(1040 111)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="7.6s" repeatCount="indefinite"/><rect width="95" height="35" rx="17.5" fill="#292B43" stroke="#AAA7FF" stroke-opacity=".8"/><circle cx="17" cy="17" r="4" fill="#AAA7FF"/><text x="30" y="22" fill="#DAD6FF">RAG</text></g></g>
  <g transform="translate(1053 289)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="8.2s" repeatCount="indefinite"/><rect width="106" height="35" rx="17.5" fill="#29382F" stroke="#C5F277" stroke-opacity=".7"/><circle cx="17" cy="17" r="4" fill="#C5F277"/><text x="30" y="22" fill="#E4F6D5">VISION</text></g></g>
 </g>
 <g fill="#C5F277"><circle cx="690" cy="186" r="2.2"><animate attributeName="opacity" values=".12;.95;.12" dur="4s" repeatCount="indefinite"/></circle><circle cx="1160" cy="216" r="2.8"><animate attributeName="opacity" values=".15;1;.15" dur="5.5s" repeatCount="indefinite"/></circle><circle cx="745" cy="322" r="2"><animate attributeName="opacity" values="1;.12;1" dur="6.3s" repeatCount="indefinite"/></circle></g>
 <rect x="1080" y="374" width="66" height="29" rx="14.5" fill="#C5F277"/><text x="1095" y="393" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#172017">2026</text>
</g>
